<title>Bio II Exam 2 Mastery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: lab-notebook study app. Sticky left nav (top tab strip on phones), one working column.
   Accents borrow the Gram stain: crystal-violet (primary) and safranin pink (secondary). */
:root {
  --bg: #f3f6f4; --surface: #ffffff; --surface-2: #e9efec; --ink: #17201c; --muted: #5a6762; --line: #d6dfdb;
  --accent: #5a3ea8; --accent-ink: #ffffff; --accent-soft: #ece8f8; --pink: #b8396a; --pink-soft: #f8e7ee;
  --ok: #23774a; --ok-soft: #e3f3ea; --warn: #9a6a12; --warn-soft: #fbf1dc; --bad: #b3362b; --bad-soft: #fbe7e4;
  --m4: #6b7280; --m5: #5a3ea8; --m6: #b8396a; --m7: #2f7d43; --m8: #b0661a; --m9: #1f6d8c; --m10: #7a4a2a;
  --display: "Zilla Slab", Rockwell, "Roboto Slab", Georgia, serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101513; --surface: #171e1b; --surface-2: #1f2824; --ink: #e4ebe7; --muted: #98a7a0; --line: #2c3833;
  --accent: #a893f2; --accent-ink: #160f2b; --accent-soft: #252040; --pink: #f07fa8; --pink-soft: #3a1f2b;
  --ok: #5cc68a; --ok-soft: #173325; --warn: #e3b153; --warn-soft: #3a2f16; --bad: #f2786c; --bad-soft: #3e1d1a;
  --m4: #a3aab5; --m5: #a893f2; --m6: #f07fa8; --m7: #6fcf87; --m8: #e8a35a; --m9: #6cc3e6; --m10: #d29a72;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #101513; --surface: #171e1b; --surface-2: #1f2824; --ink: #e4ebe7; --muted: #98a7a0; --line: #2c3833;
  --accent: #a893f2; --accent-ink: #160f2b; --accent-soft: #252040; --pink: #f07fa8; --pink-soft: #3a1f2b;
  --ok: #5cc68a; --ok-soft: #173325; --warn: #e3b153; --warn-soft: #3a2f16; --bad: #f2786c; --bad-soft: #3e1d1a;
  --m4: #a3aab5; --m5: #a893f2; --m6: #f07fa8; --m7: #6fcf87; --m8: #e8a35a; --m9: #6cc3e6; --m10: #d29a72;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 16px; line-height: 1.55; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0 0 .5em; }
h1 { font-size: clamp(1.8rem, 1.2rem + 2vw, 2.6rem); font-weight: 700; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.1rem; font-weight: 700; margin-top: 1em; }
h4 { font-size: 1rem; }
p { margin: 0 0 .75em; }
ul, ol { padding-left: 1.3em; margin: 0 0 .75em; }
li { margin-bottom: .3em; }
.muted { color: var(--muted); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.lede { font-size: 1.08rem; color: var(--muted); max-width: 68ch; }
.eyebrow { text-transform: uppercase; letter-spacing: .08em; font-size: .78rem; font-weight: 700; color: var(--muted); margin-bottom: .4em; }

/* shell */
.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; display: flex; flex-direction: column; gap: 16px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 1.15rem; line-height: 1.2; }
.brand small { display: block; font-family: var(--mono); font-size: .72rem; color: var(--muted); font-weight: 500; letter-spacing: .04em; }
#nav { display: flex; flex-direction: column; gap: 2px; }
#nav a { text-decoration: none; color: var(--ink); padding: 7px 10px; border-radius: 8px; font-weight: 700; font-size: .95rem; }
#nav a:hover { background: var(--surface-2); }
#nav a.on { background: var(--accent); color: var(--accent-ink); }
#sync { font-size: .78rem; color: var(--muted); margin-top: auto; }
main { padding-block: 28px 64px; padding-left: max(16px, 2.5vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 2.5vw); min-width: 0; max-width: 1180px; display: flex; flex-direction: column; gap: 18px; }
main > h1 { margin-bottom: 0; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; z-index: 5; flex-direction: row; align-items: center; padding-block: 8px; padding-right: max(16px, env(safe-area-inset-right, 0px)); border-right: 0; border-bottom: 1px solid var(--line); gap: 10px; }
  .brand { display: none; }
  #nav { flex-direction: row; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
  #nav a { white-space: nowrap; font-size: .9rem; }
  #sync { display: none; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}

/* blocks */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; min-width: 0; }
.card > :last-child { margin-bottom: 0; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.hero { display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid var(--ink); padding-bottom: 18px; }
.hero h1 { font-size: clamp(2.2rem, 1.4rem + 3vw, 3.4rem); margin: 0 0 .2em; }
.countdown { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; background: var(--accent-soft); border-radius: var(--r); padding: 12px 16px; }
.countdown .big { font-family: var(--display); font-size: 2rem; font-weight: 700; color: var(--accent); line-height: 1; }
.countdown label { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
input[type=date], select { font: inherit; font-size: .95rem; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; max-width: 100%; }
.stat { display: flex; flex-direction: column; gap: 6px; }
.stat .label, .label { font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; display: block; margin-bottom: 4px; }
.stat .big, p.big { font-family: var(--display); font-size: 2.4rem; font-weight: 700; line-height: 1; margin: 0; }
.stat .big.sm { font-size: 1.6rem; }
.stat .big small { font-size: 1.1rem; color: var(--muted); font-weight: 500; }
.bar { display: inline-block; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; width: 100%; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.sm { width: 80px; vertical-align: middle; }
.mbar { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(60px, 1fr) 48px; gap: 10px; align-items: center; font-size: .9rem; margin-bottom: 6px; }
.btn { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-weight: 700; font-size: .95rem; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; text-decoration: none; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.btn.bad { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.sm { padding: 5px 10px; font-size: .85rem; align-self: flex-start; }
.btn.big { padding: 12px 22px; font-size: 1.05rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: .88rem; font-weight: 700; padding: 5px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pill { display: inline-block; font-size: .78rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); white-space: nowrap; }
.pr { background: var(--bad-soft); color: var(--bad); } .py { background: var(--warn-soft); color: var(--warn); } .pg { background: var(--ok-soft); color: var(--ok); }
.mtag { display: inline-block; font-family: var(--mono); font-size: .72rem; font-weight: 500; padding: 1px 6px; border-radius: 4px; border: 1.5px solid currentColor; letter-spacing: .03em; vertical-align: 1px; }
.mtag-m4 { color: var(--m4); } .mtag-m5 { color: var(--m5); } .mtag-m6 { color: var(--m6); } .mtag-m7 { color: var(--m7); } .mtag-m8 { color: var(--m8); } .mtag-m9 { color: var(--m9); } .mtag-m10 { color: var(--m10); }
.lvl { display: inline-block; font-size: .72rem; font-weight: 700; padding: 1px 7px; border-radius: 4px; }
.lvl1 { background: var(--ok-soft); color: var(--ok); } .lvl2 { background: var(--warn-soft); color: var(--warn); } .lvl3 { background: var(--pink-soft); color: var(--pink); } .lvl4 { background: var(--bad-soft); color: var(--bad); }
.prio { font-weight: 700; } .pHigh { color: var(--bad); } .pMedium { color: var(--warn); } .pLow { color: var(--ok); }

/* tables */
.tw { overflow-x: auto; margin-bottom: .75em; border: 1px solid var(--line); border-radius: 8px; }
table.t { border-collapse: collapse; width: 100%; font-size: .92rem; }
.t th, .t td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.t thead th { background: var(--surface-2); font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; position: sticky; top: 0; }
.t tbody th { font-weight: 700; }
.t tr:last-child > * { border-bottom: 0; }
.mx td { text-align: center; } .mx td, .mx th { min-width: 120px; }
.topic .t, .card .t { margin: 0; }
.tsec .tw, .tsec table.t { margin-bottom: .75em; }

/* dashboard */
.tasks { list-style: none; padding: 0; }
.tasks li { padding: 6px 0; border-bottom: 1px dashed var(--line); }
.tasks .tt { font-family: var(--mono); font-size: .8rem; color: var(--muted); }
.tasks input, .fcheck input { accent-color: var(--accent); width: 18px; height: 18px; vertical-align: -3px; }
.weaklist li { display: flex; justify-content: space-between; gap: 8px; }
.tutor .cmds { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.tutor code { font-family: var(--mono); font-size: .85rem; background: var(--accent-soft); color: var(--accent); padding: 4px 10px; border-radius: 6px; }
.copyta { width: 100%; min-height: 120px; margin-top: 10px; font-family: var(--mono); font-size: .8rem; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; }

/* map */
.toc { display: flex; flex-wrap: wrap; gap: 6px 14px; font-weight: 700; font-size: .92rem; }
.pattern { border-left: 3px solid var(--pink); padding-left: 12px; margin-bottom: 12px; }
.pattern h3 { margin-top: 0; }
.conn { list-style: none; padding: 0; } .conn li { padding: 6px 0; border-bottom: 1px dashed var(--line); }
.day.now { border: 2px solid var(--accent); }

/* study */
.studylist { columns: 2 320px; column-gap: 24px; }
.tgroup { break-inside: avoid; margin-bottom: 16px; }
.glabel { font-weight: 700; margin-bottom: 4px; }
.tlink { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); padding: 5px 8px; border-radius: 6px; font-size: .93rem; }
.tlink:hover { background: var(--surface-2); }
.tlink.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.tlink .heat { margin-left: auto; font-size: .7rem; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--bad); }
.dot.d1 { background: var(--warn); } .dot.d2 { background: var(--ok); }
.studywrap { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 24px; align-items: start; }
.side { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.side .tgroup { margin-bottom: 10px; }
.side .tlink { font-size: .85rem; padding: 4px 6px; }
@media (max-width: 1100px) { .studywrap { grid-template-columns: minmax(0, 1fr); } .side { display: none; } }
.topic { min-width: 0; max-width: 78ch; display: flex; flex-direction: column; gap: 14px; }
.topic h1 { margin: 0; }
.flag { background: var(--warn-soft); color: var(--warn); padding: 8px 12px; border-radius: 8px; font-weight: 700; font-size: .9rem; margin: 0; }
.selfrate { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .88rem; }
.selfrate .sep { margin-left: 8px; }
.sr, .cf { font: inherit; font-size: .85rem; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.sr.on, .cf.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.cf { width: 32px; padding: 4px 0; text-align: center; }
.acc { margin-left: auto; }
.tsec h3 { margin-top: 0; padding-top: 10px; border-top: 1px solid var(--line); }
.tsec.eli5 { background: var(--accent-soft); border-radius: var(--r); padding: 14px 16px; }
.tsec.eli5 h3 { border-top: 0; padding-top: 0; }
.steps li { margin-bottom: .45em; }
.terms { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
.terms dt { font-weight: 700; } .terms dd { margin: 0; }
@media (max-width: 560px) { .terms { grid-template-columns: 1fr; } .terms dd { margin-bottom: 8px; } }
.callout { border-radius: var(--r); padding: 12px 16px; }
.callout > b:first-child { display: block; margin-bottom: 4px; font-family: var(--display); font-size: 1.05rem; }
.callout ul { margin: 0; }
.callout.hot { background: var(--surface-2); }
.callout.warn { background: var(--warn-soft); }
.callout.trap { background: var(--bad-soft); }
.callout.mem { background: var(--pink-soft); }
.callout.one { background: var(--ink); color: var(--bg); }
.callout.one p { font-size: 1.05rem; margin: 0; }
.ku { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; }
.ku > div { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; }
.recall { background: var(--surface); border: 2px dashed var(--accent); border-radius: var(--r); padding: 4px 16px 10px; }
.recall h3 { border-top: 0; }
.src { font-size: .85rem; color: var(--muted); }
.tnav { display: flex; flex-wrap: wrap; gap: 8px; }
.ctx { font-size: .9rem; color: var(--muted); font-style: italic; }

/* ladders & cycles */
.ladder { list-style: none; padding: 0; counter-reset: rung; }
.ladder li { position: relative; padding: 8px 0 8px 40px; border-left: 3px solid var(--accent); margin-left: 14px; margin-bottom: 0; }
.ladder li::before { counter-increment: rung; content: counter(rung); position: absolute; left: -15px; top: 8px; width: 27px; height: 27px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-family: var(--mono); font-size: .8rem; display: grid; place-items: center; }
.ladder b { display: block; } .ladder span { color: var(--muted); font-size: .92rem; }
.cycle { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 0; }
.cycle li { background: var(--surface-2); border-radius: 8px; padding: 8px 12px; margin: 0; position: relative; }
.cycle li + li { margin-top: 22px; }
.cycle li + li::before { content: "↓"; position: absolute; top: -21px; left: 18px; color: var(--pink); font-weight: 700; }
.cycle li.back { background: transparent; color: var(--pink); font-weight: 700; padding: 0 12px; }

/* review */
.rv { list-style: none; padding: 0; }
.rvi { border-bottom: 1px solid var(--line); padding: 10px 0; }
.rvq { display: flex; gap: 8px; align-items: baseline; }
.rvq > span:nth-child(3) { flex: 1; min-width: 0; }
.rvq .num { color: var(--muted); min-width: 2.2em; }
.star { font-size: 1.1rem; background: none; border: 0; cursor: pointer; color: var(--line); padding: 0 4px; }
.star.on { color: var(--warn); }
details { margin: 4px 0 0 3em; }
summary { cursor: pointer; color: var(--accent); font-weight: 700; font-size: .9rem; }
.ans { font-weight: 700; margin: 6px 0 2px; }
.rv details p.muted { font-size: .9rem; }

/* flashcards */
.fcwrap { display: flex; flex-direction: column; gap: 12px; align-items: stretch; max-width: 680px; }
.fc { position: relative; min-height: 220px; border: 0; padding: 0; background: none; cursor: pointer; perspective: 1200px; font: inherit; color: inherit; text-align: center; }
.face { position: absolute; inset: 0; display: grid; place-items: center; padding: 28px; border-radius: 14px; backface-visibility: hidden; transition: transform .45s ease; font-size: 1.15rem; line-height: 1.45; }
.front { background: var(--surface); border: 2px solid var(--line); font-family: var(--display); font-size: 1.4rem; font-weight: 700; }
.back { background: var(--accent); color: var(--accent-ink); transform: rotateY(180deg); }
.fc.flipped .front { transform: rotateY(180deg); } .fc.flipped .back { transform: rotateY(360deg); }
@media (prefers-reduced-motion: reduce) { .face { transition: none; } }
.fcbtns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; }

/* questions */
.cfg { display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; max-width: 820px; }
.examqs { display: flex; flex-direction: column; gap: 14px; }
.qhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.qhead .num { background: var(--ink); color: var(--bg); border-radius: 6px; padding: 1px 8px; font-size: .85rem; }
.qstem { font-size: 1.07rem; font-weight: 700; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { display: flex; gap: 8px; align-items: flex-start; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt input { margin-top: 4px; accent-color: var(--accent); flex: none; }
.opt span { min-width: 0; }
.opt.right { background: var(--ok-soft); border-color: var(--ok); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.fb { margin-top: 12px; border-radius: 8px; padding: 12px 14px; font-size: .95rem; }
.fbok { background: var(--ok-soft); } .fbbad { background: var(--bad-soft); }
.verdict { font-weight: 700; font-family: var(--display); font-size: 1.1rem; }
.qbtns { display: flex; flex-wrap: wrap; gap: 8px; }
.exambar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 6px); z-index: 4; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; box-shadow: 0 6px 18px -12px rgba(0,0,0,.35); }
@media (max-width: 860px) { .exambar { top: calc(env(safe-area-inset-top, 0px) + 58px); } }
#timer { font-size: 1.3rem; margin-left: auto; } #timer.low { color: var(--bad); }
.confirm { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(92vw, 440px); background: var(--surface); border: 2px solid var(--accent); border-radius: var(--r); padding: 16px; z-index: 20; box-shadow: 0 18px 40px -16px rgba(0,0,0,.45); display: flex; flex-wrap: wrap; gap: 8px; }
.confirm p { width: 100%; font-weight: 700; }
.reslist { list-style: none; padding: 0; } .reslist li { padding: 4px 0; border-bottom: 1px dashed var(--line); }
.weakrep li { margin-bottom: 8px; }
.tier1 b { color: var(--bad); } .tier2 b { color: var(--pink); } .tier3 b { color: var(--warn); } .tier4 b { color: var(--muted); }
.elog td { min-width: 140px; } .elog td:nth-child(2) { min-width: 240px; } .elog td:nth-child(4) { min-width: 260px; font-size: .88rem; }
.elog select { min-width: 150px; }
.cram { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
