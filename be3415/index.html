<title>BE 3415 Exam 3 Lab Bench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: a bench notebook. Sticky left rail (top tab strip on phones), one working
   column. Palette borrows the bench: agarose amber, buffer teal, UV violet. */
:root {
  --bg: #f4f2ed; --surface: #ffffff; --surface-2: #eae6dd; --ink: #1b1d1a; --muted: #5f635c;
  --line: #d8d3c7;
  --accent: #10656b; --accent-ink: #ffffff; --accent-soft: #dcecec;
  --amber: #9a5b10; --amber-soft: #f7ebd8; --violet: #6a3ea8; --violet-soft: #ebe4f7;
  --ok: #1f6b45; --ok-soft: #dfefe5; --warn: #8a6410; --warn-soft: #f8efd8;
  --bad: #a93528; --bad-soft: #fae6e2;
  --m1: #10656b; --m2: #6a3ea8; --m3: #9a5b10; --m4: #a93528; --m5: #1f6b45;
  --m6: #2a5ea8; --m7: #8a3d6b; --m8: #5c6a1f; --m9: #7a4a2a;
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15171a; --surface: #1d2024; --surface-2: #262a2f; --ink: #e6e8e4; --muted: #9aa09a;
  --line: #333840;
  --accent: #5fc8ce; --accent-ink: #0b2426; --accent-soft: #14343a;
  --amber: #e0a655; --amber-soft: #3a2c15; --violet: #b394f0; --violet-soft: #2a2140;
  --ok: #5cc68a; --ok-soft: #15321f; --warn: #e0b45c; --warn-soft: #362c14;
  --bad: #f0796a; --bad-soft: #3d1c18;
  --m1: #5fc8ce; --m2: #b394f0; --m3: #e0a655; --m4: #f0796a; --m5: #5cc68a;
  --m6: #7fb0f0; --m7: #e58bba; --m8: #b6c45c; --m9: #d09a72;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15171a; --surface: #1d2024; --surface-2: #262a2f; --ink: #e6e8e4; --muted: #9aa09a;
  --line: #333840;
  --accent: #5fc8ce; --accent-ink: #0b2426; --accent-soft: #14343a;
  --amber: #e0a655; --amber-soft: #3a2c15; --violet: #b394f0; --violet-soft: #2a2140;
  --ok: #5cc68a; --ok-soft: #15321f; --warn: #e0b45c; --warn-soft: #362c14;
  --bad: #f0796a; --bad-soft: #3d1c18;
  --m1: #5fc8ce; --m2: #b394f0; --m3: #e0a655; --m4: #f0796a; --m5: #5cc68a;
  --m6: #7fb0f0; --m7: #e58bba; --m8: #b6c45c; --m9: #d09a72;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 16px; line-height: 1.55; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0 0 .5em; }
h1 { font-size: clamp(1.8rem, 1.2rem + 2vw, 2.5rem); font-weight: 700; }
h2 { font-size: 1.3rem; font-weight: 700; }
h3 { font-size: 1.08rem; font-weight: 700; margin-top: 1em; }
h4 { font-size: 1rem; }
p { margin: 0 0 .75em; }
ul, ol { padding-left: 1.3em; margin: 0 0 .75em; }
li { margin-bottom: .3em; }
code { font-family: var(--mono); font-size: .92em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; word-break: break-all; }
.muted { color: var(--muted); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.lede { font-size: 1.05rem; color: var(--muted); max-width: 68ch; }
.eyebrow { text-transform: uppercase; letter-spacing: .09em; font-size: .76rem; font-weight: 700; color: var(--muted); margin-bottom: .4em; }

/* shell */
.shell { display: grid; grid-template-columns: 215px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 14px; display: flex; flex-direction: column; gap: 14px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 1.1rem; line-height: 1.2; }
.brand small { display: block; font-family: var(--mono); font-size: .7rem; color: var(--muted); font-weight: 400; letter-spacing: .04em; margin-top: 2px; }
#nav { display: flex; flex-direction: column; gap: 2px; }
#nav a { text-decoration: none; color: var(--ink); padding: 7px 10px; border-radius: 8px; font-weight: 600; font-size: .93rem; }
#nav a:hover { background: var(--surface-2); }
#nav a.on { background: var(--accent); color: var(--accent-ink); }
#sync { font-size: .76rem; color: var(--muted); margin-top: auto; }
main { padding-block: 26px 64px; padding-left: max(16px, 2.5vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 2.5vw); min-width: 0; max-width: 1180px; display: flex; flex-direction: column; gap: 18px; }
main > h1 { margin-bottom: 0; }
@media (max-width: 880px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; z-index: 5; flex-direction: row; align-items: center; padding-block: 8px; padding-right: max(16px, env(safe-area-inset-right, 0px)); border-right: 0; border-bottom: 1px solid var(--line); gap: 10px; }
  .brand, #sync { display: none; }
  #nav { flex-direction: row; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
  #nav a { white-space: nowrap; font-size: .88rem; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}

/* blocks */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; min-width: 0; }
.card > :last-child { margin-bottom: 0; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 370px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 235px), 1fr)); }
.hero { display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid var(--ink); padding-bottom: 18px; }
.hero h1 { font-size: clamp(2rem, 1.3rem + 3vw, 3rem); margin: 0 0 .2em; }
.countdown { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; background: var(--accent-soft); border-radius: var(--r); padding: 12px 16px; }
.countdown .big { font-family: var(--display); font-size: 1.9rem; font-weight: 700; color: var(--accent); line-height: 1; }
.countdown label { font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
input[type=date], input[type=text], select, textarea { font: inherit; font-size: .94rem; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; max-width: 100%; }
input[type=text].mono { font-family: var(--mono); letter-spacing: .06em; }
.stat { display: flex; flex-direction: column; gap: 6px; }
.stat .label, .label { font-size: .76rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; display: block; margin-bottom: 4px; }
.stat .big, p.big { font-family: var(--display); font-size: 2.2rem; font-weight: 700; line-height: 1; margin: 0; }
.stat .big.sm { font-size: 1.5rem; }
.stat .big small { font-size: 1rem; color: var(--muted); font-weight: 500; }
.bar { display: inline-block; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; width: 100%; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.sm { width: 76px; vertical-align: middle; }
.mbar { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(56px, 1fr) 44px; gap: 10px; align-items: center; font-size: .89rem; margin-bottom: 6px; }
.btn { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-weight: 700; font-size: .93rem; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; text-decoration: none; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { padding: 5px 11px; font-size: .84rem; align-self: flex-start; }
.btn.big { padding: 12px 22px; font-size: 1.02rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: .86rem; font-weight: 600; padding: 5px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pill { display: inline-block; font-size: .76rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); white-space: nowrap; }
.pr { background: var(--bad-soft); color: var(--bad); } .py { background: var(--warn-soft); color: var(--warn); } .pg { background: var(--ok-soft); color: var(--ok); }
.mtag { display: inline-block; font-family: var(--mono); font-size: .7rem; font-weight: 700; padding: 1px 6px; border-radius: 4px; border: 1.5px solid currentColor; letter-spacing: .03em; vertical-align: 1px; }
.mtag-m1 { color: var(--m1); } .mtag-m2 { color: var(--m2); } .mtag-m3 { color: var(--m3); }
.mtag-m4 { color: var(--m4); } .mtag-m5 { color: var(--m5); } .mtag-m6 { color: var(--m6); }
.mtag-m7 { color: var(--m7); } .mtag-m8 { color: var(--m8); } .mtag-m9 { color: var(--m9); }
.lvl { display: inline-block; font-size: .7rem; font-weight: 700; padding: 1px 7px; border-radius: 4px; }
.lvl1 { background: var(--ok-soft); color: var(--ok); } .lvl2 { background: var(--warn-soft); color: var(--warn); }
.lvl3 { background: var(--violet-soft); color: var(--violet); } .lvl4 { background: var(--bad-soft); color: var(--bad); }
.prio { font-weight: 700; } .pHigh { color: var(--bad); } .pMedium { color: var(--warn); } .pLow { color: var(--ok); }
.yA { color: var(--bad); font-weight: 700; } .yB { color: var(--warn); font-weight: 700; } .yC { color: var(--muted); font-weight: 700; }

/* tables */
.tw { overflow-x: auto; margin-bottom: .75em; border: 1px solid var(--line); border-radius: 8px; }
table.t { border-collapse: collapse; width: 100%; font-size: .91rem; }
.t th, .t td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.t thead th { background: var(--surface-2); font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; position: sticky; top: 0; }
.t tbody th { font-weight: 700; }
.t tr:last-child > * { border-bottom: 0; }
.topic .t, .card .t { margin: 0; }
.tsec .tw, .tsec table.t { margin-bottom: .75em; }

/* dashboard */
.tasks { list-style: none; padding: 0; }
.tasks li { padding: 6px 0; border-bottom: 1px dashed var(--line); }
.tasks .tt { font-family: var(--mono); font-size: .78rem; color: var(--muted); }
.tasks input, .fcheck input { accent-color: var(--accent); width: 18px; height: 18px; vertical-align: -3px; }
.weaklist { padding-left: 1.3em; } .weaklist li { display: flex; justify-content: space-between; gap: 8px; }
.tutor .cmds { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.tutor code { background: var(--accent-soft); color: var(--accent); padding: 4px 10px; border-radius: 6px; }
.copyta { width: 100%; min-height: 120px; margin-top: 10px; font-family: var(--mono); font-size: .78rem; }

/* map view */
.toc { display: flex; flex-wrap: wrap; gap: 6px 14px; font-weight: 600; font-size: .9rem; }
.conn { list-style: none; padding: 0; } .conn li { padding: 6px 0; border-bottom: 1px dashed var(--line); }
.day.now { border: 2px solid var(--accent); }

/* study */
.studylist { columns: 2 300px; column-gap: 24px; }
.tgroup { break-inside: avoid; margin-bottom: 16px; }
.glabel { font-weight: 700; margin-bottom: 4px; font-size: .93rem; }
.tlink { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); padding: 5px 8px; border-radius: 6px; font-size: .92rem; }
.tlink:hover { background: var(--surface-2); }
.tlink.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.tlink .heat { margin-left: auto; font-size: .68rem; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--bad); }
.dot.d1 { background: var(--warn); } .dot.d2 { background: var(--ok); }
.studywrap { display: grid; grid-template-columns: 265px minmax(0, 1fr); gap: 24px; align-items: start; }
.side { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.side .tgroup { margin-bottom: 10px; }
.side .tlink { font-size: .84rem; padding: 4px 6px; }
@media (max-width: 1100px) { .studywrap { grid-template-columns: minmax(0, 1fr); } .side { display: none; } }
.topic { min-width: 0; max-width: 78ch; display: flex; flex-direction: column; gap: 14px; }
.topic h1 { margin: 0; }
.selfrate { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .86rem; }
.selfrate .sep { margin-left: 8px; }
.sr, .cf { font: inherit; font-size: .84rem; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.sr.on, .cf.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.cf { width: 32px; padding: 4px 0; text-align: center; }
.acc { margin-left: auto; }
.tsec h3 { margin-top: 0; padding-top: 10px; border-top: 1px solid var(--line); }
.tsec.eli5 { background: var(--accent-soft); border-radius: var(--r); padding: 14px 16px; }
.tsec.eli5 h3 { border-top: 0; padding-top: 0; }
.terms { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
.terms dt { font-weight: 700; } .terms dd { margin: 0; }
@media (max-width: 560px) { .terms { grid-template-columns: 1fr; } .terms dd { margin-bottom: 8px; } }
.callout { border-radius: var(--r); padding: 12px 16px; }
.callout > b:first-child { display: block; margin-bottom: 4px; font-family: var(--display); font-size: 1.03rem; }
.callout ul { margin: 0; }
.callout.hot { background: var(--surface-2); }
.callout.warn { background: var(--warn-soft); }
.callout.trap { background: var(--bad-soft); }
.callout.mem { background: var(--violet-soft); }
.callout.one { background: var(--ink); color: var(--bg); }
.callout.one p { font-size: 1.02rem; margin: 0; }
.ku { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 12px; }
.ku > div { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; }
.recall { background: var(--surface); border: 2px dashed var(--accent); border-radius: var(--r); padding: 4px 16px 10px; }
.recall h3 { border-top: 0; }
.src { font-size: .84rem; color: var(--muted); }
.tnav { display: flex; flex-wrap: wrap; gap: 8px; }

/* review */
.rv { list-style: none; padding: 0; }
.rvi { border-bottom: 1px solid var(--line); padding: 10px 0; }
.rvq { display: flex; gap: 8px; align-items: baseline; }
.rvq > .stem { flex: 1; min-width: 0; }
.rvq .num { color: var(--muted); min-width: 2.4em; }
.star { font-size: 1.05rem; background: none; border: 0; cursor: pointer; color: var(--line); padding: 0 4px; }
.star.on { color: var(--warn); }
details { margin: 4px 0 0 3em; }
@media (max-width: 560px) { details { margin-left: 1em; } }
summary { cursor: pointer; color: var(--accent); font-weight: 700; font-size: .89rem; }
.ans { font-weight: 700; margin: 6px 0 2px; }
.rvopts { list-style: upper-alpha; margin: 4px 0 6px; }
.rvopts li.right { font-weight: 700; color: var(--ok); }

/* flashcards */
.fcwrap { display: flex; flex-direction: column; gap: 12px; align-items: stretch; max-width: 680px; }
.fc { position: relative; min-height: 230px; border: 0; padding: 0; background: none; cursor: pointer; perspective: 1200px; font: inherit; color: inherit; text-align: center; }
.face { position: absolute; inset: 0; display: grid; place-items: center; padding: 26px; border-radius: 14px; backface-visibility: hidden; transition: transform .45s ease; font-size: 1.05rem; line-height: 1.45; overflow: auto; }
.front { background: var(--surface); border: 2px solid var(--line); font-family: var(--display); font-size: 1.25rem; font-weight: 700; }
.back { background: var(--accent); color: var(--accent-ink); transform: rotateY(180deg); }
.fc.flipped .front { transform: rotateY(180deg); } .fc.flipped .back { transform: rotateY(360deg); }
@media (prefers-reduced-motion: reduce) { .face { transition: none; } }
.fcbtns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; }

/* questions */
.cfg { display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; max-width: 820px; }
.examqs { display: flex; flex-direction: column; gap: 14px; }
.qhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.qhead .num { background: var(--ink); color: var(--bg); border-radius: 6px; padding: 1px 8px; font-size: .83rem; }
.qstem { font-size: 1.04rem; font-weight: 600; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { display: flex; gap: 8px; align-items: flex-start; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt input { margin-top: 4px; accent-color: var(--accent); flex: none; }
.opt span { min-width: 0; }
.opt.right { background: var(--ok-soft); border-color: var(--ok); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.fb { margin-top: 12px; border-radius: 8px; padding: 12px 14px; font-size: .94rem; }
.fbok { background: var(--ok-soft); } .fbbad { background: var(--bad-soft); }
.verdict { font-weight: 700; font-family: var(--display); font-size: 1.07rem; }
.qbtns { display: flex; flex-wrap: wrap; gap: 8px; }
.exambar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 6px); z-index: 4; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; box-shadow: 0 6px 18px -12px rgba(0,0,0,.35); }
@media (max-width: 880px) { .exambar { top: calc(env(safe-area-inset-top, 0px) + 56px); } }
#timer { font-size: 1.25rem; margin-left: auto; } #timer.low { color: var(--bad); }
.confirm { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(92vw, 430px); background: var(--surface); border: 2px solid var(--accent); border-radius: var(--r); padding: 16px; z-index: 20; box-shadow: 0 18px 40px -16px rgba(0,0,0,.45); display: flex; flex-wrap: wrap; gap: 8px; }
.confirm p { width: 100%; font-weight: 700; }
.reslist { list-style: none; padding: 0; } .reslist li { padding: 4px 0; border-bottom: 1px dashed var(--line); }
.weakrep { padding-left: 1.3em; } .weakrep li { margin-bottom: 8px; }
.tier1 b { color: var(--bad); } .tier2 b { color: var(--violet); } .tier3 b { color: var(--warn); } .tier4 b { color: var(--muted); }
.elog td { min-width: 130px; } .elog td:nth-child(2) { min-width: 230px; } .elog td:nth-child(4) { min-width: 240px; font-size: .86rem; }
.elog select { min-width: 145px; }
.cram { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 16px; }
.cram li { margin-bottom: .45em; }
.fcheck { list-style: none; padding: 0; } .fcheck li { padding: 6px 0; border-bottom: 1px dashed var(--line); }
.exam h2 { margin-bottom: .2em; }

/* ---- problems: sequences, gels, maps ---- */
